[project]
name = "ecohain"
version = "0.1.0"
description = "A blockchain-based backend service for sustainable eco tracking and carbon footprint monitoring."
authors = [
    {name = "Your Name",email = "you@example.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.12,<4.0"

dependencies = [
    "fastapi[standard] (>=0.119.0,<0.120.0)",
    "sqlalchemy (>=2.0.43,<3.0.0)",
    "psycopg2-binary (>=2.9.10,<3.0.0)",
    "uvicorn[standard] (>=0.35.0,<0.36.0)",
    "python-jose (>=3.5.0,<4.0.0)",
    "passlib[bcrypt] (>=1.7.4,<2.0.0)",
    "python-dotenv (>=1.1.1,<2.0.0)",
    "starlette (>=0.48.0,<0.49.0)",
    "python-multipart (>=0.0.20,<0.0.21)",
    "pydantic[email] (>=2.12.2,<3.0.0)",
    "cloudinary (>=1.44.1,<2.0.0)",
    "beautifulsoup4 (>=4.14.2,<5.0.0)",
    "selenium (>=4.38.0,<5.0.0)",
    "langchain-community (>=0.4.1,<0.5.0)",
    "langchain-text-splitters (>=1.1.0,<2.0.0)",
    "langchain (>=1.2.6,<2.0.0)",
    "langchain-classic (>=1.0.1,<2.0.0)",
    "langchain-ollama (>=1.0.1,<2.0.0)",
    "pydantic-settings (>=2.12.0,<3.0.0)",
    "pyjwt (>=2.10.1,<3.0.0)",
    "pytz (>=2025.2,<2026.0)",
    "joblib (>=1.5.3,<2.0.0)",
    "pandas (>=3.0.1,<4.0.0)",
    "scikit-learn (>=1.8.0,<2.0.0)",
    "google-generativeai (>=0.8.6,<0.9.0)",
    "google-genai (>=1.65.0,<2.0.0)",
    "geoip2 (>=5.2.0,<6.0.0)",
    "redis (>=7.3.0,<8.0.0)",
    "fastapi-cache2 (>=0.2.2,<0.3.0)"
]

[dependency-groups]
dev = [
    "pytest (>=8.4.2,<9.0.0)",
    "alembic (>=1.16.5,<2.0.0)",
    "uvicorn[standard] (>=0.35.0,<0.36.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
