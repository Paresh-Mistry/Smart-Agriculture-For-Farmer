<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width" initial-scale="1.0">
    <title>Web Page</title>
</head>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    table{
        border-collapse: separate;
    }

    th,td{
        border: 1px solid black ;
        padding: 10px;
    }

    input[type="text"]{
        padding: 10px;
        margin: 10px;
        border-radius: 2px;
    }
</style>

<body>
    <table>
        <tr>
            <th>Name</th>
            <th>Profession</th>
            <th>Skills</th>
        </tr>
        <tr>
            <td>John Doe</td>
            <td>Software Engineer</td>
            <td>JavaScript, Python, C++</td>
        </tr>
        <tr>
            <td>Jane Smith</td>
            <td>Data Scientist</td>
            <td>Python, R, SQL</td>
        </tr>

        <input type="text" placeholder="Enter Text" width="" required value="This is text">
        <input type="file" accept=".jpg, .jpeg, .png" required>
        <input type="checkbox" id="subscribe" name="subscribe" value="newsletter" checked>
    </table> 
</body>

</html>
